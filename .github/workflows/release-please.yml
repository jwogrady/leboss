name: Release Please

# Opens and maintains a release PR from Conventional Commits on master.
# Merging that PR tags the release and updates CHANGELOG.md.
# Config: release-please-config.json and .release-please-manifest.json.

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
